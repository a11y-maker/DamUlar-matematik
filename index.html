gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
  </script>

    // --- PAPAN PERMAINAN 10x10 ---
    function buildBoardGrid() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      // Susunan Zig-Zag dari Petak 100 (atas kiri) ke Petak 1 (bawah kiri)
      for (let row = 9; row >= 0; row--) {
        const isEvenRowFromBottom = row % 2 === 0;
        for (let col = 0; col < 10; col++) {
          const cellNum = isEvenRowFromBottom
            ? row * 10 + col + 1
            : row * 10 + (10 - col);

          const cell = document.createElement('div');
          cell.id = `cell-${cellNum}`;

          let bgStyle = (row + col) % 2 === 0 ? 'bg-slate-100 text-slate-800' : 'bg-sky-100 text-sky-950';
          let extraIcon = '';

          if (cellNum === 100) {
            bgStyle = 'bg-yellow-400 text-slate-950 ring-2 ring-yellow-500';
            extraIcon = '<span class="text-xs sm:text-base">👑</span>';
          } else if (cellNum === 1) {
            bgStyle = 'bg-emerald-300 text-emerald-950';
            extraIcon = '<span class="text-[10px] font-bungee">MULA</span>';
          } else if (LADDERS[cellNum]) {
            bgStyle = 'bg-emerald-200 text-emerald-900';
            extraIcon = `<span class="text-[9px] sm:text-[11px] font-bold text-emerald-700">🪜→${LADDERS[cellNum]}</span>`;
          } else if (SNAKES[cellNum]) {
            bgStyle = 'bg-rose-200 text-rose-900';
            extraIcon = `<span class="text-[9px] sm:text-[11px] font-bold text-rose-700">🐍→${SNAKES[cellNum]}</span>`;
          }

          cell.className = `${bgStyle} rounded-md sm:rounded-lg p-0.5 sm:p-1 flex flex-col justify-between relative select-none shadow-inner`;
          cell.innerHTML = `
            <div class="flex justify-between items-start leading-none">
              <span class="font-bungee text-[10px] sm:text-xs opacity-80">${cellNum}</span>
              ${extraIcon}
            </div>
            <div id="tokens-${cellNum}" class="flex flex-wrap items-center justify-center gap-0.5 min-h-[16px] z-20"></div>
          `;
          container.appendChild(cell);
        }
      }
    }

    function getCellCenter(cellNum) {
      const cell = document.getElementById(`cell-${cellNum}`);
      const canvas = document.getElementById('boardCanvas');
      if (!cell || !canvas) return { x: 0, y: 0 };

      const cellRect = cell.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      return {
        x: cellRect.left - canvasRect.left + cellRect.width / 2,
        y: cellRect.top - canvasRect.top + cellRect.height / 2
      };
    }

    function drawSnakesAndLadders() {
      const canvas = document.getElementById('boardCanvas');
      if (!canvas) return;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Lukis Tangga
      Object.entries(LADDERS).forEach(([start, end]) => {
        const p1 = getCellCenter(Number(start));
        const p2 = getCellCenter(Number(end));
        drawLadder(ctx, p1.x, p1.y, p2.x, p2.y);
      });

      // Lukis Ular
      Object.entries(SNAKES).forEach(([head, tail]) => {
        const p1 = getCellCenter(Number(head));
        const p2 = getCellCenter(Number(tail));
        drawSnake(ctx, p1.x, p1.y, p2.x, p2.y);
      });
    }

    function drawLadder(ctx, x1, y1, x2, y2) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const perp = angle + Math.PI / 2;
      const width = 9;

      const ox = Math.cos(perp) * width;
      const oy = Math.sin(perp) * width;

      ctx.save();
      ctx.lineCap = 'round';

      // Batang kiri & kanan tangga
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x1 - ox, y1 - oy);
      ctx.lineTo(x2 - ox, y2 - oy);
      ctx.moveTo(x1 + ox, y1 + oy);
      ctx.lineTo(x2 + ox, y2 + oy);
      ctx.stroke();

      // Anak tangga
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const steps = Math.max(3, Math.floor(dist / 22));
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const rx = x1 + (x2 - x1) * t;
        const ry = y1 + (y2 - y1) * t;
        ctx.beginPath();
        ctx.moveTo(rx - ox, ry - oy);
        ctx.lineTo(rx + ox, ry + oy);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawSnake(ctx, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      const offset = 28;
      const perpAngle = Math.atan2(dy, dx) + Math.PI / 2;

      const cp1x = (x1 + midX) / 2 + Math.cos(perpAngle) * offset;
      const cp1y = (y1 + midY) / 2 + Math.sin(perpAngle) * offset;
      const cp2x = (midX + x2) / 2 - Math.cos(perpAngle) * offset;
      const cp2y = (midY + y2) / 2 - Math.sin(perpAngle) * offset;

      ctx.save();
      ctx.lineCap = 'round';

      // Badan luar ular
      ctx.strokeStyle = '#991b1b';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
      ctx.stroke();

      // Jalur dalam ular
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 4;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Kepala ular
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(x1, y1, 8, 0, Math.PI * 2);
      ctx.fill();

      // Mata ular
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(x1 - 2.5, y1 - 2, 2, 0, Math.PI * 2);
      ctx.arc(x1 + 2.5, y1 - 2, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function renderPlayerTokens() {

    // --- DADU ROBLOX ---
    const DIE_PATTERNS = {

      initAudio();

      isRolling = true;

      const d1El = document.getElementById('dice1');

      d2El.classList.add('rolling');

        const r1 = Math.floor(Math.random() * 6) + 1;

    // --- PENJANA SOALAN MATEMATIK (DARJAH 4 - 6) ---
    function generateMathQuestion() {
      const topics = ['Darab & Bahagi', 'Pecahan & Perpuluhan', 'Peratus & Wang', 'Operasi Bergabung', 'Ukuran & Masa'];
      const topic = topics[Math.floor(Math.random() * topics.length)];
      let q = '';
      let ans = 0;
      let choices = new Set();

      if (topic === 'Darab & Bahagi') {
        if (Math.random() < 0.5) {
          const a = Math.floor(Math.random() * 25) + 12;
          const b = Math.floor(Math.random() * 8) + 4;
          ans = a * b;
          q = `Kira hasil darab: ${a} × ${b} = ?`;
        } else {
          const b = Math.floor(Math.random() * 8) + 4;
          ans = Math.floor(Math.random() * 24) + 11;
          const a = ans * b;
          q = `Kira hasil bahagi: ${a} ÷ ${b} = ?`;
        }
      } else if (topic === 'Pecahan & Perpuluhan') {
        const a = (Math.floor(Math.random() * 45) + 12) / 10;
        const b = (Math.floor(Math.random() * 35) + 11) / 10;
        ans = Number((a + b).toFixed(1));
        q = `Jumlahkan perpuluhan ini: ${a.toFixed(1)} + ${b.toFixed(1)} = ?`;
      } else if (topic === 'Peratus & Wang') {
        const pct = [10, 20, 25, 50][Math.floor(Math.random() * 4)];
        const price = (Math.floor(Math.random() * 9) + 2) * 20;
        ans = (pct / 100) * price;
        q = `Berapakah ${pct}% daripada RM${price}?`;
      } else if (topic === 'Operasi Bergabung') {
        const a = Math.floor(Math.random() * 20) + 10;
        const b = Math.floor(Math.random() * 6) + 3;
        const c = Math.floor(Math.random() * 5) + 2;
        ans = a + b * c;
        q = `Selesaikan: ${a} + (${b} × ${c}) = ?`;
      } else {
        const hours = Math.floor(Math.random() * 3) + 2;
        const mins = [15, 30, 45][Math.floor(Math.random() * 3)];
        ans = hours * 60 + mins;
        q = `Tukarkan ${hours} jam ${mins} minit kepada minit.`;
      }

      choices.add(ans);
      while (choices.size < 4) {
        const offset = (Math.floor(Math.random() * 9) + 1) * (Math.random() < 0.5 ? 1 : -1);
        const fake = Number.isInteger(ans) ? Math.max(1, ans + offset) : Number(Math.max(0.5, ans + offset * 0.5).toFixed(1));
        choices.add(fake);
      }

      return {
        topic,
        question: q,
        answer: ans,
        options: Array.from(choices).sort(() => Math.random() - 0.5)
      };
    }

    function presentMathChallenge() {
      isAwaitingAnswer = true;
      currentQuestion = generateMathQuestion();

      document.getElementById('topicBadge').textContent = currentQuestion.topic;
      document.getElementById('waitingPrompt').classList.add('hidden');
      document.getElementById('activeQuestionPrompt').classList.remove('hidden');
      document.getElementById('questionText').textContent = currentQuestion.question;

      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';

      currentQuestion.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'bg-slate-100 hover:bg-indigo-600 hover:text-white border-2 border-slate-800 rounded-xl py-2.5 px-3 font-bungee text-sm sm:text-base transition shadow-sm';
        btn.textContent = currentQuestion.topic === 'Peratus & Wang' ? `RM${opt}` : opt;
        btn.onclick = () => submitMathAnswer(opt);
        optionsGrid.appendChild(btn);
      });

      startQuestionTimer();
    }

    function startQuestionTimer() {
      clearInterval(questionTimer);
      timeLeft = 30;
      const badge = document.getElementById('timerBadge');
      const secEl = document.getElementById('timerSeconds');
      badge.classList.remove('hidden');
      secEl.textContent = timeLeft;

      questionTimer = setInterval(() => {
        timeLeft--;
        secEl.textContent = timeLeft;
        if (timeLeft <= 5 && timeLeft > 0) playClockTick(true);

        if (timeLeft <= 0) {
          clearInterval(questionTimer);
          submitMathAnswer(null); // Masa tamat
        }
      }, 1000);
    }

    async function submitMathAnswer(selected) {
      if (!isAwaitingAnswer) return;
      clearInterval(questionTimer);
      isAwaitingAnswer = false;
      document.getElementById('timerBadge').classList.add('hidden');

      const player = players[currentTurn];
      player.total++;

      const isCorrect = selected !== null && Number(selected) === Number(currentQuestion.answer);

      document.getElementById('activeQuestionPrompt').classList.add('hidden');
      document.getElementById('waitingPrompt').classList.remove('hidden');

      if (isCorrect) {
        player.correct++;
        player.score += 50 + timeLeft;
        playSuccessChime();
        spawnFloatingText(player.pos, `+${50 + timeLeft} ROBUX!`, '#10b981');
        addLog(`✅ BETUL! ${player.name} mara ${pendingSteps} petak!`);
        renderScoreboards();
        await movePlayerSteps(currentTurn, pendingSteps);
      } else {
        player.score = Math.max(0, player.score - 20);
        playRobloxOof();
        spawnFloatingText(player.pos, 'OOF! -20', '#ef4444');
        addLog(`❌ SALAH! Jawapan sebenar ialah ${currentQuestion.answer}. ${player.name} kekal di petak ${player.pos}.`);
        renderScoreboards();
        advanceTurn();
      }
    }

    // --- PERGERAKAN BIDAK, TANGGA & ULAR ---
    async function movePlayerSteps(playerIdx, steps) {
      isMoving = true;
      updateTurnUI();
      const player = players[playerIdx];

      for (let i = 0; i < steps; i++) {
        if (player.pos < 100) {
          player.pos++;
          playFootstep(i);
          renderPlayerTokens();
          renderScoreboards();
          await sleep(220);
        }
      }

      // Semak Tangga
      if (LADDERS[player.pos]) {
        const target = LADDERS[player.pos];
        playLadderSound();
        spawnFloatingText(player.pos, 'NAIK TANGGA! 🚀', '#10b981');
        addLog(`🪜 ${player.name} memanjat tangga dari ${player.pos} ke ${target}!`);
        await sleep(450);
        player.pos = target;
        player.score += 30;
        renderPlayerTokens();
        renderScoreboards();
      }
      // Semak Ular
      else if (SNAKES[player.pos]) {
        const target = SNAKES[player.pos];
        playSnakeSound();
        spawnFloatingText(player.pos, 'DIPATUK ULAR! 🐍', '#ef4444');
        addLog(`🐍 Alamak! ${player.name} turun dari ${player.pos} ke ${target}!`);
        await sleep(450);
        player.pos = target;
        renderPlayerTokens();
        renderScoreboards();
      }

      isMoving = false;

      // Semak Kemenangan
      if (player.pos >= 100) {
        player.pos = 100;
        player.score += 200;
        renderPlayerTokens();
        renderScoreboards();
        triggerVictory(player);
        return;
      }

      advanceTurn();
    }

    function advanceTurn() {
      currentTurn = (currentTurn + 1) % players.length;
      resetTurnState();
      renderScoreboards();
      renderPlayerTokens();
      updateTurnUI();

      if (gameMode === 'online') {
        window.OnlineMultiplayer.broadcast(getRoomState());
      }
    }

    function resetTurnState() {
      pendingSteps = 0;
      isRolling = false;
      isAwaitingAnswer = false;
      isMoving = false;
      clearInterval(questionTimer);
      document.getElementById('timerBadge').classList.add('hidden');
      document.getElementById('activeQuestionPrompt').classList.add('hidden');
      document.getElementById('waitingPrompt').classList.remove('hidden');
      document.getElementById('diceSumText').innerHTML = 'Jumlah Langkah: <span class="text-blue-600 text-lg">?</span>';
    }

    // --- KESAN VISUAL, KEMENANGAN & RESET ---
    function spawnFloatingText(cellNum, text, color) {
      const container = document.getElementById('particleContainer');
      const center = getCellCenter(cellNum);
      const el = document.createElement('div');
      el.className = 'float-text';
      el.style.left = `${center.x}px`;
      el.style.top = `${center.y}px`;
      el.style.color = color;
      el.textContent = text;
      container.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }

    function triggerVictory(winner) {
      playVictoryTrumpet();
      const accuracy = winner.total > 0 ? Math.round((winner.correct / winner.total) * 100) : 100;
      document.getElementById('winnerTitle').textContent = `${winner.name.toUpperCase()} MENANG!`;
      document.getElementById('finalScore').textContent = winner.score;
      document.getElementById('accuracyStats').textContent = `Ketepatan Menjawab: ${accuracy}% (${winner.correct}/${winner.total} soalan)`;
      document.getElementById('victoryModal').classList.remove('hidden');
      addLog(`🏆 GG! ${winner.name} memenangi permainan dengan ${winner.score} Robux!`);
    }

    function resetGame() {
      document.getElementById('victoryModal').classList.add('hidden');
      players.forEach(p => {
        p.pos = 1;
        p.score = 0;
        p.correct = 0;
        p.total = 0;
      });
      currentTurn = 0;
      resetTurnState();
      renderScoreboards();
      renderPlayerTokens();
      updateTurnUI();
      addLog('🔄 Permainan dimulakan semula!');
      if (gameMode === 'online') {
        window.OnlineMultiplayer.broadcast(getRoomState());
      }
    }

    function addLog(message) {
      const logBox = document.getElementById('gameLog');
      const item = document.createElement('div');
      item.textContent = `• ${message}`;
      logBox.prepend(item);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
